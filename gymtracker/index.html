<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="theme-color" content="#0a0a0a">
<title>GymLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #151515;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text2: #888;
    --accent: #c8ff00;
    --accent-dim: #a0cc00;
    --red: #ff4444;
    --green: #44ff88;
    --blue: #4488ff;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    padding-top: var(--safe-top);
    padding-bottom: calc(70px + var(--safe-bottom));
  }

  /* === HEADER === */
  .header {
    padding: 16px 20px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 22px; font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .header-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .header-btn:active { background: var(--border); }

  /* === TABS === */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #111; border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: var(--safe-bottom);
  }
  .tab {
    flex: 1; padding: 12px 0 8px; text-align: center;
    background: none; border: none; color: var(--text2);
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .tab.active { color: var(--accent); }
  .tab svg { width: 22px; height: 22px; }

  /* === PAGES === */
  .page { display: none; padding: 0 16px 20px; }
  .page.active { display: block; }

  /* === LOG PAGE === */
  .exercise-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .exercise-card.expanded { border-color: var(--accent); }
  .exercise-card.done { border-left: 3px solid var(--green); }
  .exercise-card.done .exercise-name { opacity: 0.6; }
  .done-badge {
    font-size: 11px; color: var(--green); font-family: 'Space Mono', monospace;
    display: flex; align-items: center; gap: 3px;
  }
  .pending-badge {
    font-size: 11px; color: var(--text2); font-family: 'Space Mono', monospace;
    opacity: 0.5;
  }
  .exercise-header {
    padding: 14px 16px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; user-select: none;
  }
  .exercise-name {
    font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .exercise-name .muscle-tag {
    font-size: 10px; color: var(--accent); background: rgba(200,255,0,0.1);
    padding: 2px 8px; border-radius: 20px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .video-link {
    color: var(--blue); font-size: 12px; text-decoration: none;
    font-weight: 600; padding: 4px 10px; background: rgba(68,136,255,0.1);
    border-radius: 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .exercise-body { padding: 0 16px 16px; }

  /* === SET INPUT === */
  .set-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; padding: 10px 12px;
    background: var(--surface2); border-radius: 10px;
  }
  .set-label {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: var(--text2); min-width: 26px;
  }
  .input-group {
    display: flex; align-items: center; gap: 0;
    background: var(--bg); border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .input-group label {
    font-size: 9px; color: var(--text2); text-transform: uppercase;
    letter-spacing: 0.5px; position: absolute; top: -16px; left: 0;
    white-space: nowrap;
  }
  .input-wrapper { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .input-wrapper span { font-size: 10px; color: var(--text2); font-weight: 600; }
  .adj-btn {
    width: 36px; height: 38px; border: none;
    background: transparent; color: var(--accent);
    font-size: 20px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
  }
  .adj-btn:active { background: rgba(200,255,0,0.15); }
  .num-input {
    width: 52px; text-align: center; background: transparent;
    border: none; color: var(--text); font-size: 16px; font-weight: 700;
    font-family: 'Space Mono', monospace; padding: 8px 0;
  }
  .num-input:focus { outline: none; }
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .log-set-btn {
    background: var(--accent); color: #000; border: none;
    border-radius: 10px; padding: 10px 16px; font-size: 13px;
    font-weight: 700; cursor: pointer; margin-left: auto;
    font-family: 'DM Sans', sans-serif; white-space: nowrap;
  }
  .log-set-btn:active { background: var(--accent-dim); }

  .logged-sets { margin-top: 8px; }
  .logged-set {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
  }
  .logged-set:last-child { border-bottom: none; }
  .logged-set .check { color: var(--green); margin-right: 8px; }
  .logged-set .del-btn {
    background: none; border: none; color: var(--red);
    font-size: 16px; cursor: pointer; padding: 4px 8px; opacity: 0.6;
  }
  .watch-video-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; margin-bottom: 10px;
    background: rgba(68,136,255,0.12); border: 1px solid rgba(68,136,255,0.3);
    border-radius: 10px; color: var(--blue); font-size: 14px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    font-family: 'DM Sans', sans-serif;
  }
  .watch-video-btn:active { background: rgba(68,136,255,0.25); }
  .watch-video-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .instructions-toggle {
    background: none; border: none; color: var(--blue); font-size: 12px;
    font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 8px;
    font-family: 'DM Sans', sans-serif;
  }
  .instructions-text {
    font-size: 13px; color: var(--text2); line-height: 1.5;
    padding: 10px 12px; background: var(--bg); border-radius: 8px;
    margin-bottom: 10px; border: 1px solid var(--border);
  }

  /* === HISTORY PAGE === */
  .hist-detail-date {
    font-family: 'Space Mono', monospace; font-size: 13px;
    color: var(--accent); margin: 12px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .hist-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 8px;
    padding: 12px 14px;
  }
  .hist-card-name {
    font-weight: 600; font-size: 14px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .hist-card-name .muscle-tag {
    font-size: 9px; color: var(--accent); background: rgba(200,255,0,0.1);
    padding: 2px 6px; border-radius: 12px; font-weight: 700;
    text-transform: uppercase;
  }
  .hist-set {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 13px; color: var(--text2);
    font-family: 'Space Mono', monospace;
  }
  .hist-set .check { color: var(--green); }
  .hist-set .time { margin-left: auto; font-size: 11px; opacity: 0.6; }
  .hist-summary {
    display: flex; gap: 12px; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .hist-stat {
    font-size: 11px; color: var(--text2); font-family: 'Space Mono', monospace;
  }
  .hist-stat b { color: var(--text); font-size: 16px; display: block; margin-bottom: 2px; }
  .cal-cell.has-workout .cal-day { color: var(--green); }
  .cal-cell.has-workout::after {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--green); position: absolute; bottom: 4px;
  }
  .cal-cell { position: relative; }
  .cal-cell.active-day { border-color: var(--green); background: var(--surface2); }
  .hist-empty {
    text-align: center; padding: 20px; color: var(--text2); font-size: 13px;
  }

  /* === SETTINGS PAGE === */
  .section-title {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: var(--accent); text-transform: uppercase;
    letter-spacing: 1px; margin: 20px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .exercise-edit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
    position: relative;
  }
  .exercise-edit-card input, .exercise-edit-card select {
    width: 100%; padding: 10px 12px; margin-top: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    font-family: 'DM Sans', sans-serif;
  }
  .exercise-edit-card input:focus, .exercise-edit-card select:focus {
    outline: none; border-color: var(--accent);
  }
  .exercise-edit-card select { -webkit-appearance: none; }
  .field-label { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .exercise-edit-actions {
    position: absolute; top: 10px; right: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .move-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .move-btn:active { background: var(--border); color: var(--accent); }
  .move-btn:disabled { opacity: 0.2; pointer-events: none; }
  .remove-exercise-btn {
    background: rgba(255,68,68,0.15); border: none; color: var(--red);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .add-btn {
    width: 100%; padding: 14px; background: var(--surface);
    border: 2px dashed var(--border); border-radius: var(--radius);
    color: var(--text2); font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  .add-btn:active { border-color: var(--accent); color: var(--accent); }
  .export-btn {
    width: 100%; padding: 14px; background: var(--accent);
    border: none; border-radius: var(--radius);
    color: #000; font-size: 14px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  .export-btn:active { background: var(--accent-dim); }
  .danger-btn {
    width: 100%; padding: 14px; background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.3); border-radius: var(--radius);
    color: var(--red); font-size: 14px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
    font-family: 'DM Sans', sans-serif;
  }

  .weight-increment-setting {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); padding: 14px;
    border-radius: var(--radius); border: 1px solid var(--border);
  }
  .weight-increment-setting span { font-size: 14px; font-weight: 500; flex: 1; }
  .weight-increment-setting select {
    padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    font-family: 'DM Sans', sans-serif; -webkit-appearance: none;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--text2);
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .toast {
    position: fixed; top: calc(var(--safe-top) + 10px); left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--green); color: #000; padding: 10px 20px;
    border-radius: 30px; font-size: 13px; font-weight: 700;
    z-index: 200; transition: transform 0.3s ease;
    font-family: 'Space Mono', monospace;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* === PLAN PAGE === */
  .tpl-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
  }
  .tpl-card.editing { border-color: var(--accent); }
  .tpl-header {
    padding: 14px 16px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; user-select: none;
  }
  .tpl-name {
    font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .tpl-count {
    font-size: 11px; color: var(--text2); font-family: 'Space Mono', monospace;
  }
  .tpl-body { padding: 0 16px 16px; }
  .tpl-name-input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    font-family: 'DM Sans', sans-serif;
  }
  .tpl-name-input:focus { outline: none; border-color: var(--accent); }
  .tpl-exercise-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 4px;
    background: var(--surface2); border-radius: 8px;
    cursor: pointer; user-select: none;
    border-left: 3px solid transparent;
  }
  .tpl-exercise-row.included { border-left-color: var(--green); }
  .tpl-exercise-row .ex-name { flex: 1; font-size: 14px; }
  .tpl-exercise-row .ex-muscle {
    font-size: 10px; color: var(--accent); background: rgba(200,255,0,0.1);
    padding: 2px 6px; border-radius: 12px; font-weight: 700;
    text-transform: uppercase;
  }
  .tpl-exercise-row .ex-toggle {
    font-size: 16px; color: var(--green); width: 20px; text-align: center;
  }
  .tpl-delete-btn {
    background: rgba(255,68,68,0.15); border: none; color: var(--red);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 10px;
  }
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; margin-bottom: 8px;
  }
  .cal-nav span {
    font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;
  }
  .cal-nav button {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .cal-nav button:active { background: var(--border); }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin-bottom: 12px;
  }
  .cal-hdr {
    text-align: center; font-size: 10px; color: var(--text2);
    font-weight: 700; padding: 4px 0; text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    background: var(--surface); border: 2px solid transparent;
    border-radius: 8px; cursor: pointer;
  }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.selected { border-color: var(--accent); }
  .cal-cell.today .cal-day { color: var(--accent); }
  .cal-day { font-size: 13px; font-weight: 600; font-family: 'Space Mono', monospace; }
  .cal-dot {
    font-size: 8px; font-weight: 700; color: #000;
    width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
  }
  .cal-actions {
    display: flex; align-items: center; gap: 8px;
    padding: 12px; background: var(--surface);
    border-radius: var(--radius); border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .cal-actions span {
    font-size: 13px; font-weight: 600; color: var(--accent);
    font-family: 'Space Mono', monospace;
  }
  .cal-actions select {
    flex: 1; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; -webkit-appearance: none;
  }
  .cal-actions button {
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif; border: none;
  }
  .cal-actions button:active { opacity: 0.7; }
  .cal-assign-btn { background: var(--accent); color: #000; }
  .cal-clear-btn { background: rgba(255,68,68,0.15); color: var(--red); }
  .today-template {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .today-template .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  /* scrollbar */
  ::-webkit-scrollbar { display: none; }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f2f2; --surface: #fff; --surface2: #f8f8f8;
      --border: #e0e0e0; --text: #111; --text2: #777;
      --accent: #1a8f00; --accent-dim: #157000;
    }
    .tab-bar { background: #fafafa; }
    .adj-btn { color: #1a8f00; }
    .header h1 { color: #1a8f00; }
    .exercise-card.done { border-left-color: #2d8f4e; }
    .done-badge { color: #2d8f4e; }
    .cal-dot { color: #fff; }
  }

  /* === GUIDE PAGE === */
  #page-guide .guide-tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #page-guide .guide-tab {
    flex-shrink: 0; padding: 10px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  #page-guide .guide-tab.active {
    background: var(--accent); color: #000; border-color: var(--accent);
  }
  #page-guide .guide-banner {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px; color: var(--text2); line-height: 1.5;
  }
  #page-guide .g-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; padding: 14px 16px;
  }
  #page-guide .g-name { font-size: 15px; font-weight: 600; }
  #page-guide .g-rpe { font-size: 11px; color: var(--text2); margin-top: 1px; }
  #page-guide .g-note { font-size: 12px; color: var(--text2); margin-top: 2px; }
  #page-guide .g-meta { display: flex; gap: 20px; margin: 6px 0 8px; }
  #page-guide .g-meta-item { font-size: 12px; color: var(--text2); }
  #page-guide .g-meta-label {
    color: var(--text2); font-size: 10px; display: block;
    margin-bottom: 1px; text-transform: uppercase; font-weight: 600;
    letter-spacing: 0.5px; opacity: 0.6;
  }
  #page-guide .g-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  #page-guide .g-pill {
    display: inline-block; padding: 3px 9px; border-radius: 6px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  #page-guide .g-yt-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 10px; font-size: 13px;
    font-weight: 700; text-decoration: none;
    background: rgba(255,0,51,0.15); color: #ff4444;
    border: 1px solid rgba(255,0,51,0.3);
    font-family: 'DM Sans', sans-serif;
  }
  #page-guide .g-yt-btn:active { opacity: 0.7; }
  #page-guide .g-yt-btn svg { width: 14px; height: 14px; fill: #ff4444; }
  #page-guide .g-step {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-right: 8px;
    font-family: 'Space Mono', monospace;
  }
  #page-guide .g-week {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;

<script>
// ========================
// DATA LAYER
// ========================
const DEFAULT_EXERCISES = [
  { id: 'ex11', name: 'HIT Warmup', muscle: 'Full Body', videoUrl: 'https://photos.app.goo.gl/hHtiD851Vs8HHxKR8', defaultWeight: 0, defaultReps: 1, instructions: '' },
  { id: 'ex1', name: 'Single Arm Farmer Carry', muscle: 'Core', videoUrl: 'https://youtube.com/shorts/fdRD8FJ0QWs?si=1b-amYBy6uFStwyf', defaultWeight: 20, defaultReps: 2, instructions: 'Walk with 1 dumbbell in your hand with a straight arm, dumbbell by your side. Core should be activated and shoulders back, chest up. Walk with perfect posture for 30 seconds. Alternate dumbbell to the other side and walk 30 more seconds.' },
  { id: 'ex2', name: 'Cable High Row', muscle: 'Back', videoUrl: 'https://youtube.com/shorts/ifjtUEBhIxY?si=RnK_TPSBQMqpO80Y', defaultWeight: 20, defaultReps: 10, instructions: 'Set cable at top height, use single handle attachment. Pull the handle down until the elbow reaches the side body. Perform 10 on each side, 2 sets.' },
  { id: 'ex3', name: 'Cable Tricep Press', muscle: 'Triceps', videoUrl: 'https://youtube.com/shorts/xguGXQAvbKk?si=4ZtU__ZewO7ytf9l', defaultWeight: 20, defaultReps: 3, instructions: 'Set cable at top height, use bar attachment. Standing with an activated core, using an overgrip on the bar with both hands, keep the upper arm in contact with the side body and move from the elbows in a downward press. 10 reps, 2 sets.' },
  { id: 'ex12', name: 'Tricep Press 2', muscle: 'Triceps', videoUrl: 'https://photos.app.goo.gl/X9Xh6GZpiTZP7Asf6', defaultWeight: 25, defaultReps: 10, instructions: '' },
  { id: 'ex4', name: 'Shoulder Internal Rotation', muscle: 'Shoulders', videoUrl: 'https://photos.app.goo.gl/6hGmc2mQZWDUU74W9', defaultWeight: 7.5, defaultReps: 3, instructions: 'Set cable at mid height. Use single handle attachment. With one hand on the handle, bend the elbow 90 degrees and internally rotate at the shoulder joint bringing your hand to the midline. 10 times right and left side, 2 sets.' },
  { id: 'ex14', name: 'Cable Core Press', muscle: 'Core', videoUrl: 'https://photos.app.goo.gl/QxQicwzSfwccRyDr5', defaultWeight: 7.5, defaultReps: 3, instructions: '' },
  { id: 'ex5', name: 'Cable Deadlift', muscle: 'Posterior Chain', videoUrl: 'https://photos.app.goo.gl/vJzhUkBKckedXYjz7', defaultWeight: 20, defaultReps: 3, instructions: 'Set cable to lowest height. Use bar attachment. With feet shoulder width apart, hinge at hips while pushing the hips back and hold the bar. Using the back of your legs (hamstrings & glutes) pull the bar to the hips as you stand up. 10 reps, 2 sets.' },
  { id: 'ex15', name: 'Suitcase Deadlift', muscle: 'Posterior Chain', videoUrl: 'https://photos.app.goo.gl/kCByxbpWKoJeUMXS6', defaultWeight: 20, defaultReps: 3, instructions: '' },
  { id: 'ex6', name: 'Reverse Fly Singles', muscle: 'Upper Back', videoUrl: 'https://photos.app.goo.gl/bMGX6gkFzeB75ntc8', defaultWeight: 5, defaultReps: 3, instructions: 'Stand with feet slightly separated for stability, hinge at hips until the chest is over the knees. Using one arm at a time, lift arm laterally using the muscles in the shoulder blade area (rhomboids, mid-trapezius). 10 on each side, 2 sets.' },
  { id: 'ex8', name: 'Bicep Kickback', muscle: 'Biceps', videoUrl: 'https://photos.app.goo.gl/GoDEhU872mFrzm167', defaultWeight: 5, defaultReps: 3, instructions: '' },
  { id: 'ex9', name: 'External Rotation', muscle: 'Shoulders', videoUrl: 'https://photos.app.goo.gl/ce73shrch4FLkeCv9', defaultWeight: 5, defaultReps: 3, instructions: '' },
  { id: 'ex7', name: 'Back Extension', muscle: 'Lower Back', videoUrl: 'https://photos.app.goo.gl/QCa9eubSix7hYcnw9', defaultWeight: 0, defaultReps: 3, instructions: 'Using the Roman Chair, adjust the pad to sit right below your hip bone. Secure your feet and lower your head towards the floor. Using the muscles in your lower back and glutes, lift yourself to straighten the back. 10 reps, 2 sets.' },
  { id: 'ex18', name: 'TRX Body Weight', muscle: 'Core', videoUrl: 'https://photos.app.goo.gl/7C2PvV1t9S1fUY1D8', defaultWeight: 0, defaultReps: 10, instructions: 'Using the TRX cable attached to the wall, position yourself in a reverse plank. Push your body up and down while keeping the core tight throughout the movement.' },
  { id: 'ex10', name: 'Cool Down Stretch', muscle: 'Flexibility', videoUrl: 'https://photos.app.goo.gl/ksutEWxSLdhcL9eCA', defaultWeight: 0, defaultReps: 1, instructions: '' },
  { id: 'ex17', name: 'CoolDown', muscle: 'Flexibility', videoUrl: 'https://photos.app.goo.gl/X5qXPyKgjcDyhnMd8', defaultWeight: 0, defaultReps: 1, instructions: '' },
];

function loadExercises() {
  const d = localStorage.getItem('gymlog_exercises');
  return d ? JSON.parse(d) : DEFAULT_EXERCISES;
}
function saveExercises(ex) { localStorage.setItem('gymlog_exercises', JSON.stringify(ex)); }

function loadHistory() {
  const d = localStorage.getItem('gymlog_history');
  return d ? JSON.parse(d) : [];
}
function saveHistory(h) { localStorage.setItem('gymlog_history', JSON.stringify(h)); }

function getWeightStep() {
  return parseFloat(localStorage.getItem('gymlog_step') || '5');
}
function setWeightStep(v) { localStorage.setItem('gymlog_step', v); }

// Track current input state per exercise
let currentInputs = {};

// Templates & Schedule
const TPL_COLORS = ['#c8ff00', '#4488ff', '#ff4444', '#44ff88', '#ff88ff', '#ff8844'];
function loadTemplates() {
  const d = localStorage.getItem('gymlog_templates');
  return d ? JSON.parse(d) : [];
}
function saveTemplates(t) { localStorage.setItem('gymlog_templates', JSON.stringify(t)); }
function loadSchedule() {
  const d = localStorage.getItem('gymlog_schedule');
  return d ? JSON.parse(d) : {};
}
function saveSchedule(s) { localStorage.setItem('gymlog_schedule', JSON.stringify(s)); }
function getTplColor(tplId) {
  const idx = loadTemplates().findIndex(t => t.id === tplId);
  return TPL_COLORS[Math.max(0, idx) % TPL_COLORS.length];
}

// Guide completion tracking (per day)
function loadGuideDone() {
  const d = localStorage.getItem('gymlog_guide_done');
  return d ? JSON.parse(d) : {};
}
function saveGuideDone(data) { localStorage.setItem('gymlog_guide_done', JSON.stringify(data)); }
function guideExerciseFromKey(key) {
  const parts = key.split('-');
  const idx = parseInt(parts[parts.length - 1]);
  if (key.startsWith('warmup-')) return guideWarmup[idx];
  if (key.startsWith('cooldown-')) return guideCooldown[idx];
  const wo3Match = key.match(/^wo3-w(\d+)d(\d+)-/);
  if (wo3Match) {
    const wk = guideWorkout3.find(w => w.week === parseInt(wo3Match[1]));
    if (wk) {
      const day = wk.days.find(d => d.day === parseInt(wo3Match[2]));
      return day ? day.moves[idx] : null;
    }
    return null;
  }
  const weekMatch = key.match(/^week(\d+)-/);
  if (weekMatch) {
    const wk = guideWeeks.find(w => w.week === parseInt(weekMatch[1]));
    return wk ? wk.moves[idx] : null;
  }
  return null;
}
function toggleGuideDone(key) {
  const now = new Date();
  const today = now.toLocaleDateString('en-CA');
  const data = loadGuideDone();
  if (!data[today]) data[today] = [];
  const idx = data[today].indexOf(key);
  const marking = idx < 0;
  if (idx >= 0) { data[today].splice(idx, 1); } else { data[today].push(key); }
  saveGuideDone(data);

  // Sync with workout history
  const history = loadHistory();
  const histId = 'guide_' + key;
  if (marking) {
    const ex = guideExerciseFromKey(key);
    if (ex) {
      history.push({
        id: histId,
        exerciseId: histId,
        guideName: ex.name,
        weight: 0,
        reps: 1,
        date: today,
        time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
        timestamp: now.toISOString()
      });
      saveHistory(history);
    }
  } else {
    const filtered = history.filter(h => !(h.id === histId && h.date === today));
    saveHistory(filtered);
  }
}
function isGuideDone(key) {
  const today = new Date().toLocaleDateString('en-CA');
  const data = loadGuideDone();
  return (data[today] || []).includes(key);
}
function getGuideDoneCount(prefix) {
  const today = new Date().toLocaleDateString('en-CA');
  const data = loadGuideDone();
  return (data[today] || []).filter(k => k.startsWith(prefix)).length;
}

let editingTplId = null;
let calendarYear = new Date().getFullYear();
let calendarMonth = new Date().getMonth();
let selectedDays = new Set();

// History calendar state
let histYear = new Date().getFullYear();
let histMonth = new Date().getMonth();
let histSelectedDate = new Date().toLocaleDateString('en-CA');

// ========================
// RENDERING
// ========================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg || '✓ Set logged';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function renderLogPage() {
  let exercises = loadExercises();
  const history = loadHistory();
  const container = document.getElementById('exerciseList');
  const empty = document.getElementById('emptyLog');

  if (exercises.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Get today's sets grouped by exercise
  const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
  const todaySets = history.filter(h => h.date === today);

  // Filter by today's template if assigned
  const schedule = loadSchedule();
  const tplId = schedule[today];
  let templateLabel = '';
  if (tplId) {
    const tpl = loadTemplates().find(t => t.id === tplId);
    if (tpl) {
      exercises = exercises.filter(ex => tpl.exerciseIds.includes(ex.id));
      templateLabel = `<div class="today-template" onclick="switchToTab('page-plan')">
        <span class="dot" style="background:${getTplColor(tplId)}"></span>
        ${escHtml(tpl.name)}
      </div>`;
    }
  }

  container.innerHTML = templateLabel + exercises.map(ex => {
    const exSets = todaySets.filter(s => s.exerciseId === ex.id);
    const lastSet = getLastSetForExercise(ex.id);
    const ci = currentInputs[ex.id] || {
      weight: lastSet ? lastSet.weight : ex.defaultWeight,
      reps: lastSet ? lastSet.reps : ex.defaultReps
    };
    currentInputs[ex.id] = ci;

    const isDone = exSets.length > 0;

    return `
      <div class="exercise-card${isDone ? ' done' : ''}" id="card-${ex.id}">
        <div class="exercise-header" onclick="toggleCard('${ex.id}')">
          <div class="exercise-name">
            ${ex.name}
            <span class="muscle-tag">${ex.muscle}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${ex.videoUrl ? `<a href="${ex.videoUrl}" target="_blank" class="video-link" onclick="event.stopPropagation()">▶ Video</a>` : ''}
            ${isDone
              ? `<span class="done-badge">✓ ${exSets.length}s</span>`
              : `<span class="pending-badge">—</span>`
            }
          </div>
        </div>
        <div class="exercise-body" id="body-${ex.id}" style="display:none">
          ${ex.videoUrl ? `
            <a href="${escHtml(ex.videoUrl)}" target="_blank" class="watch-video-btn" onclick="event.stopPropagation()">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Watch Exercise Video
            </a>
          ` : ''}
          ${ex.instructions ? `
            <button class="instructions-toggle" onclick="toggleInstructions('${ex.id}')">ℹ How to perform</button>
            <div class="instructions-text" id="instr-${ex.id}" style="display:none">${escHtml(ex.instructions)}</div>
          ` : ''}
          <div class="set-row">
            <div class="input-wrapper">
              <span>WEIGHT (lbs)</span>
              <div class="input-group">
                <button class="adj-btn" onclick="adjust('${ex.id}','weight',-1)">−</button>
                <input type="number" class="num-input" id="w-${ex.id}" value="${ci.weight}" 
                  onchange="currentInputs['${ex.id}'].weight=parseFloat(this.value)||0">
                <button class="adj-btn" onclick="adjust('${ex.id}','weight',1)">+</button>
              </div>
            </div>
            <div class="input-wrapper">
              <span>REPS</span>
              <div class="input-group">
                <button class="adj-btn" onclick="adjust('${ex.id}','reps',-1)">−</button>
                <input type="number" class="num-input" id="r-${ex.id}" value="${ci.reps}" 
                  onchange="currentInputs['${ex.id}'].reps=parseInt(this.value)||0">
                <button class="adj-btn" onclick="adjust('${ex.id}','reps',1)">+</button>
              </div>
            </div>
            <button class="log-set-btn" onclick="logSet('${ex.id}')">LOG</button>
          </div>
          ${exSets.length > 0 ? `
            <div class="logged-sets">
              ${exSets.map((s, i) => `
                <div class="logged-set">
                  <div><span class="check">✓</span>Set ${i+1}: ${s.weight} lbs × ${s.reps} reps</div>
                  <button class="del-btn" onclick="deleteSet('${s.id}')">×</button>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function getLastSetForExercise(exId) {
  const history = loadHistory();
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].exerciseId === exId) return history[i];
  }
  return null;
}

function toggleCard(exId) {
  const card = document.getElementById(`card-${exId}`);
  const body = document.getElementById(`body-${exId}`);
  const isOpen = body.style.display !== 'none';
  // Close all
  document.querySelectorAll('.exercise-body').forEach(b => b.style.display = 'none');
  document.querySelectorAll('.exercise-card').forEach(c => c.classList.remove('expanded'));
  if (!isOpen) {
    body.style.display = 'block';
    card.classList.add('expanded');
  }
}

function toggleInstructions(exId) {
  const el = document.getElementById('instr-' + exId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function adjust(exId, field, dir) {
  const step = field === 'weight' ? getWeightStep() : 1;
  const input = document.getElementById((field === 'weight' ? 'w-' : 'r-') + exId);
  let val = parseFloat(input.value) || 0;
  val = Math.max(0, val + dir * step);
  input.value = val;
  currentInputs[exId][field] = val;
}

function logSet(exId) {
  const weight = parseFloat(document.getElementById('w-' + exId).value) || 0;
  const reps = parseInt(document.getElementById('r-' + exId).value) || 0;
  const now = new Date();
  const entry = {
    id: 'set_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    exerciseId: exId,
    weight, reps,
    date: now.toLocaleDateString('en-CA'),
    time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
    timestamp: now.toISOString()
  };
  const history = loadHistory();
  history.push(entry);
  saveHistory(history);
  showToast(`✓ ${weight} lbs × ${reps}`);
  renderLogPage();
  // Re-open the card
  setTimeout(() => toggleCard(exId), 10);
}

function deleteSet(setId) {
  let history = loadHistory();
  const set = history.find(s => s.id === setId);
  history = history.filter(s => s.id !== setId);
  saveHistory(history);
  renderLogPage();
  if (set) setTimeout(() => toggleCard(set.exerciseId), 10);
}

// ========================
// HISTORY
// ========================
function renderHistoryPage() {
  const history = loadHistory();
  const empty = document.getElementById('emptyHistory');

  if (history.length === 0) {
    document.getElementById('historyCalendar').innerHTML = '';
    document.getElementById('historyDetail').innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Auto-select today if no date selected
  if (!histSelectedDate) {
    histSelectedDate = new Date().toLocaleDateString('en-CA');
    histYear = new Date().getFullYear();
    histMonth = new Date().getMonth();
  }

  renderHistoryCalendar(history);
  renderHistoryDetail(history);
}

function renderHistoryCalendar(history) {
  const container = document.getElementById('historyCalendar');
  const year = histYear;
  const month = histMonth;
  const today = new Date().toLocaleDateString('en-CA');
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // Build set of dates that have workouts
  const workoutDates = new Set();
  history.forEach(function(h) { workoutDates.add(h.date); });

  let html = '\
    <div class="cal-nav">\
      <button onclick="navHistMonth(-1)">←</button>\
      <span>' + monthLabel + '</span>\
      <button onclick="navHistMonth(1)">→</button>\
    </div>\
    <div class="cal-grid">\
      <div class="cal-hdr">Su</div><div class="cal-hdr">Mo</div><div class="cal-hdr">Tu</div>\
      <div class="cal-hdr">We</div><div class="cal-hdr">Th</div><div class="cal-hdr">Fr</div>\
      <div class="cal-hdr">Sa</div>';

  for (var i = 0; i < firstDay; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var hasWorkout = workoutDates.has(dateStr);
    var isToday = dateStr === today;
    var isActive = dateStr === histSelectedDate;

    var cls = 'cal-cell';
    if (hasWorkout) cls += ' has-workout';
    if (isToday) cls += ' today';
    if (isActive) cls += ' active-day';

    html += '<div class="' + cls + '" onclick="selectHistDay(\'' + dateStr + '\')">' +
      '<span class="cal-day">' + d + '</span>' +
      '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderHistoryDetail(history) {
  const container = document.getElementById('historyDetail');
  const exercises = loadExercises();

  if (!histSelectedDate) {
    container.innerHTML = '<div class="hist-empty">Tap a day to view workout</div>';
    return;
  }

  const daySets = history.filter(function(h) { return h.date === histSelectedDate; });

  if (daySets.length === 0) {
    var d = new Date(histSelectedDate + 'T12:00:00');
    var label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    container.innerHTML = '<div class="hist-detail-date">' + label + '</div>' +
      '<div class="hist-empty">No workout on this day</div>';
    return;
  }

  // Group by exercise
  var byEx = {};
  daySets.forEach(function(s) {
    if (!byEx[s.exerciseId]) byEx[s.exerciseId] = [];
    byEx[s.exerciseId].push(s);
  });

  var d = new Date(histSelectedDate + 'T12:00:00');
  var label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  var totalSets = daySets.length;
  var totalExercises = Object.keys(byEx).length;

  var html = '<div class="hist-detail-date">' + label + '</div>';

  html += '<div class="hist-summary">' +
    '<div class="hist-stat"><b>' + totalExercises + '</b>exercises</div>' +
    '<div class="hist-stat"><b>' + totalSets + '</b>total sets</div>' +
    '</div>';

  html += Object.keys(byEx).map(function(exId) {
    var ex = exercises.find(function(e) { return e.id === exId; });
    var isGuide = exId.startsWith('guide_');
    var name = ex ? ex.name : (byEx[exId][0].guideName || 'Unknown');
    var muscle = ex ? ex.muscle : (isGuide ? 'Guide' : '');

    return '<div class="hist-card">' +
      '<div class="hist-card-name">' + escHtml(name) +
        (muscle ? ' <span class="muscle-tag">' + escHtml(muscle) + '</span>' : '') +
      '</div>' +
      byEx[exId].map(function(s, i) {
        if (isGuide) {
          return '<div class="hist-set">' +
            '<span class="check">✓</span> Completed' +
            '<span class="time">' + s.time + '</span>' +
          '</div>';
        }
        return '<div class="hist-set">' +
          '<span class="check">✓</span> ' +
          'Set ' + (i + 1) + ': ' + s.weight + ' lbs × ' + s.reps + ' reps' +
          '<span class="time">' + s.time + '</span>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');

  container.innerHTML = html;
}

function navHistMonth(dir) {
  histMonth += dir;
  if (histMonth < 0) { histMonth = 11; histYear--; }
  if (histMonth > 11) { histMonth = 0; histYear++; }
  histSelectedDate = null;
  renderHistoryPage();
}

function selectHistDay(dateStr) {
  histSelectedDate = dateStr;
  var history = loadHistory();
  renderHistoryCalendar(history);
  renderHistoryDetail(history);
}

function renderSettingsPage() {
  const exercises = loadExercises();
  document.getElementById('weightStep').value = getWeightStep();

  document.getElementById('exerciseEditor').innerHTML = exercises.map((ex, i) => `
    <div class="exercise-edit-card">
      <div class="exercise-edit-actions">
        <button class="move-btn" onclick="moveExercise(${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="move-btn" onclick="moveExercise(${i},1)" ${i === exercises.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="remove-exercise-btn" onclick="removeExercise(${i})">×</button>
      </div>
      <div class="field-label">Exercise Name</div>
      <input value="${escHtml(ex.name)}" onchange="updateExercise(${i},'name',this.value)" placeholder="e.g. Bench Press">
      <div class="field-label" style="margin-top:10px">Muscle Group</div>
      <input value="${escHtml(ex.muscle)}" onchange="updateExercise(${i},'muscle',this.value)" placeholder="e.g. Chest">
      <div class="field-label" style="margin-top:10px">Instructions</div>
      <input value="${escHtml(ex.instructions || '')}" onchange="updateExercise(${i},'instructions',this.value)" placeholder="Form cues and notes...">
      <div class="field-label" style="margin-top:10px">Video URL (Google Photos / YouTube)</div>
      <input value="${escHtml(ex.videoUrl)}" onchange="updateExercise(${i},'videoUrl',this.value)" placeholder="https://photos.google.com/...">
      <div style="display:flex;gap:8px;margin-top:10px">
        <div style="flex:1">
          <div class="field-label">Default Weight</div>
          <input type="number" value="${ex.defaultWeight}" onchange="updateExercise(${i},'defaultWeight',parseFloat(this.value)||0)">
        </div>
        <div style="flex:1">
          <div class="field-label">Default Reps</div>
          <input type="number" value="${ex.defaultReps}" onchange="updateExercise(${i},'defaultReps',parseInt(this.value)||0)">
        </div>
      </div>
    </div>
  `).join('');
}

function updateExercise(i, field, val) {
  const ex = loadExercises();
  ex[i][field] = val;
  saveExercises(ex);
}

function addExercise() {
  const ex = loadExercises();
  ex.push({
    id: 'ex_' + Date.now(),
    name: 'New Exercise',
    muscle: 'Other',
    videoUrl: '',
    defaultWeight: 0,
    defaultReps: 10
  });
  saveExercises(ex);
  renderSettingsPage();
  // Scroll to bottom
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function moveExercise(i, dir) {
  const ex = loadExercises();
  const j = i + dir;
  if (j < 0 || j >= ex.length) return;
  [ex[i], ex[j]] = [ex[j], ex[i]];
  saveExercises(ex);
  renderSettingsPage();
}

function removeExercise(i) {
  if (!confirm('Remove this exercise?')) return;
  const ex = loadExercises();
  ex.splice(i, 1);
  saveExercises(ex);
  renderSettingsPage();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========================
// CSV EXPORT
// ========================
function exportCSV() {
  const history = loadHistory();
  const exercises = loadExercises();
  if (history.length === 0) { alert('No data to export'); return; }

  let csv = 'Date,Time,Exercise,Muscle Group,Weight (lbs),Reps\n';
  history.forEach(h => {
    const ex = exercises.find(e => e.id === h.exerciseId);
    const name = ex ? ex.name : (h.guideName || 'Unknown');
    const muscle = ex ? ex.muscle : (h.exerciseId && h.exerciseId.startsWith('guide_') ? 'Guide' : '');
    csv += `${h.date},${h.time},"${name}","${muscle}",${h.weight},${h.reps}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gymlog_${new Date().toLocaleDateString('en-CA')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📁 CSV Downloaded');
}

function clearAllData() {
  if (!confirm('Delete ALL workout history? This cannot be undone.')) return;
  if (!confirm('Are you really sure?')) return;
  saveHistory([]);
  showToast('🗑 History cleared');
  renderHistoryPage();
  renderLogPage();
}

// PLAN PAGE
// ========================
function renderPlanPage() {
  renderTemplateList();
  renderCalendar();
}

function renderTemplateList() {
  const templates = loadTemplates();
  const exercises = loadExercises();
  const container = document.getElementById('templateList');

  if (templates.length === 0) {
    container.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:10px 0">No templates yet. Create one to get started.</div>';
    return;
  }

  container.innerHTML = templates.map(tpl => {
    const isEditing = editingTplId === tpl.id;
    const color = getTplColor(tpl.id);

    return `
      <div class="tpl-card${isEditing ? ' editing' : ''}">
        <div class="tpl-header" onclick="toggleTemplate('${tpl.id}')">
          <div class="tpl-name">
            <span class="cal-dot" style="background:${color}">${tpl.name[0]}</span>
            ${escHtml(tpl.name)}
          </div>
          <span class="tpl-count">${tpl.exerciseIds.length} exercises</span>
        </div>
        ${isEditing ? `
          <div class="tpl-body">
            <input class="tpl-name-input" value="${escHtml(tpl.name)}"
              onchange="renameTemplate('${tpl.id}', this.value)" placeholder="Template name">
            ${exercises.map(ex => {
              const included = tpl.exerciseIds.includes(ex.id);
              return `
                <div class="tpl-exercise-row${included ? ' included' : ''}"
                  onclick="toggleTplExercise('${tpl.id}','${ex.id}')">
                  <span class="ex-toggle">${included ? '✓' : ''}</span>
                  <span class="ex-name">${escHtml(ex.name)}</span>
                  <span class="ex-muscle">${escHtml(ex.muscle)}</span>
                </div>
              `;
            }).join('')}
            <button class="tpl-delete-btn" onclick="deleteTemplate('${tpl.id}')">Delete Template</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function toggleTemplate(tplId) {
  editingTplId = editingTplId === tplId ? null : tplId;
  renderTemplateList();
}

function addTemplate() {
  const templates = loadTemplates();
  const newTpl = {
    id: 'tpl_' + Date.now(),
    name: 'Template ' + (templates.length + 1),
    exerciseIds: []
  };
  templates.push(newTpl);
  saveTemplates(templates);
  editingTplId = newTpl.id;
  renderPlanPage();
}

function renameTemplate(tplId, name) {
  const templates = loadTemplates();
  const tpl = templates.find(t => t.id === tplId);
  if (tpl) {
    tpl.name = name;
    saveTemplates(templates);
  }
}

function toggleTplExercise(tplId, exId) {
  const templates = loadTemplates();
  const tpl = templates.find(t => t.id === tplId);
  if (!tpl) return;
  const idx = tpl.exerciseIds.indexOf(exId);
  if (idx >= 0) {
    tpl.exerciseIds.splice(idx, 1);
  } else {
    tpl.exerciseIds.push(exId);
  }
  saveTemplates(templates);
  renderTemplateList();
}

function deleteTemplate(tplId) {
  if (!confirm('Delete this template?')) return;
  let templates = loadTemplates();
  templates = templates.filter(t => t.id !== tplId);
  saveTemplates(templates);
  const schedule = loadSchedule();
  Object.keys(schedule).forEach(date => {
    if (schedule[date] === tplId) delete schedule[date];
  });
  saveSchedule(schedule);
  editingTplId = null;
  renderPlanPage();
}

function renderCalendar() {
  const container = document.getElementById('calendarView');
  const schedule = loadSchedule();
  const templates = loadTemplates();
  const today = new Date().toLocaleDateString('en-CA');
  const year = calendarYear;
  const month = calendarMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let html = `
    <div class="cal-nav">
      <button onclick="navMonth(-1)">←</button>
      <span>${monthLabel}</span>
      <button onclick="navMonth(1)">→</button>
    </div>
    <div class="cal-grid">
      <div class="cal-hdr">Su</div><div class="cal-hdr">Mo</div><div class="cal-hdr">Tu</div>
      <div class="cal-hdr">We</div><div class="cal-hdr">Th</div><div class="cal-hdr">Fr</div>
      <div class="cal-hdr">Sa</div>
  `;

  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const tplId = schedule[dateStr];
    const tpl = tplId ? templates.find(t => t.id === tplId) : null;
    const isSelected = selectedDays.has(dateStr);
    const isToday = dateStr === today;

    let cls = 'cal-cell';
    if (isSelected) cls += ' selected';
    if (isToday) cls += ' today';

    html += `
      <div class="${cls}" onclick="toggleDay('${dateStr}')">
        <span class="cal-day">${d}</span>
        ${tpl ? '<span class="cal-dot" style="background:' + getTplColor(tplId) + '">' + tpl.name[0] + '</span>' : ''}
      </div>
    `;
  }

  html += '</div>';

  if (selectedDays.size > 0) {
    html += `
      <div class="cal-actions">
        <span>${selectedDays.size} day${selectedDays.size > 1 ? 's' : ''}</span>
        <select id="assignTpl">
          <option value="">Pick template</option>
          ${templates.map(t => '<option value="' + t.id + '">' + escHtml(t.name) + '</option>').join('')}
        </select>
        <button class="cal-assign-btn" onclick="assignTemplate()">Set</button>
        <button class="cal-clear-btn" onclick="clearScheduleForSelected()">Clear</button>
      </div>
    `;
  }

  container.innerHTML = html;
}

function navMonth(dir) {
  calendarMonth += dir;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  selectedDays.clear();
  renderCalendar();
}

function toggleDay(dateStr) {
  if (selectedDays.has(dateStr)) {
    selectedDays.delete(dateStr);
  } else {
    selectedDays.add(dateStr);
  }
  renderCalendar();
}

function assignTemplate() {
  const select = document.getElementById('assignTpl');
  const tplId = select.value;
  if (!tplId) { showToast('Pick a template first'); return; }
  const schedule = loadSchedule();
  selectedDays.forEach(function(date) { schedule[date] = tplId; });
  saveSchedule(schedule);
  const tpl = loadTemplates().find(t => t.id === tplId);
  showToast('✓ ' + (tpl ? tpl.name : 'Template') + ' → ' + selectedDays.size + ' days');
  selectedDays.clear();
  renderCalendar();
}

function clearScheduleForSelected() {
  const schedule = loadSchedule();
  selectedDays.forEach(function(date) { delete schedule[date]; });
  saveSchedule(schedule);
  showToast('✓ Schedule cleared');
  selectedDays.clear();
  renderCalendar();
}

function switchToTab(pageId) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.page === pageId);
  });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(pageId).classList.add('active');
  if (pageId === 'page-plan') renderPlanPage();
  if (pageId === 'page-history') renderHistoryPage();
  if (pageId === 'page-settings') renderSettingsPage();
  if (pageId === 'page-log') renderLogPage();
  if (pageId === 'page-guide') renderGuidePage();
  window.scrollTo(0, 0);
}

function renderGuideCard(m,idx,stepColor,hasWeight,key){
  const p=m.muscles.map(([n,c])=>gPill(n,c)).join('');
  const sc=GC[stepColor]||GC.gray;
  const done=key?isGuideDone(key):false;
  return `<div class="g-card${hasWeight?' g-inner':''}${done?' g-done':''}">
    <div style="display:flex;align-items:center;margin-bottom:2px">
      ${idx!==null?`<span class="g-step" style="background:${sc.bg};color:${sc.t}">${idx}</span>`:''}
      <div class="g-name">${m.name}</div>
      ${key?`<button class="g-check-btn${done?' checked':''}" onclick="onGuideCheck('${key}')">✓</button>`:''}
    </div>
    ${m.note?`<div class="g-note">${m.note}</div>`:''}
    ${m.rpe?`<div class="g-rpe">RPE ${m.rpe}</div>`:''}
    <div class="g-meta">
      <div class="g-meta-item"><span class="g-meta-label">${hasWeight?'Sets':'Reps / time'}</span>${m.sets||m.reps}</div>
      ${hasWeight&&m.weight?`<div class="g-meta-item"><span class="g-meta-label">Weight</span>${m.weight}</div>`:''}
    </div>
    <div class="g-pills">${p}</div>
    ${gYtBtn(m.yt)}
  </div>`;
}

let activeGuideTab = 'warmup';
function onGuideCheck(key){
  toggleGuideDone(key);
  renderGuidePage();
  switchGuide(activeGuideTab);
}

function switchGuide(id){
  activeGuideTab=id;
  document.querySelectorAll('#page-guide .guide-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#page-guide .guide-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('guide-'+id).classList.add('active');
  document.querySelectorAll('#page-guide .guide-tab')[{warmup:0,workout:1,workout3:2,cooldown:3}[id]].classList.add('active');
}

function renderGuidePage(){
  // Warmup section
  const wuTotal=guideWarmup.length;
  const wuDone=getGuideDoneCount('warmup-');
  let wuH='<div class="guide-banner">Do before every session \u2014 getting muscles warm and blood flowing.</div>';
  guideWarmup.forEach((m,i)=>{wuH+=renderGuideCard(m,i+1,'amber',false,'warmup-'+i);});
  document.getElementById('guide-warmup').innerHTML=wuH;

  // Cooldown section
  const cdTotal=guideCooldown.length;
  const cdDone=getGuideDoneCount('cooldown-');
  let cdH='<div class="guide-banner">Do after every session. Hold each stretch gently \u2014 no bouncing.</div>';
  guideCooldown.forEach((m,i)=>{cdH+=renderGuideCard(m,i+1,'teal',false,'cooldown-'+i);});
  cdH+='<div class="g-section-label">Yoga Resources</div>';
  guideYoga.forEach(r=>{cdH+=`<div class="g-resource"><div class="g-resource-title">${r.name}</div><div class="g-resource-desc">${r.time} \u00b7 ${r.ch}</div>${gYtBtn(r.yt)}</div>`;});
  document.getElementById('guide-cooldown').innerHTML=cdH;

  // Workout section with weeks
  let wkTotalAll=0,wkDoneAll=0;
  let wkH=`<div class="g-legend">
    <span><span class="g-legend-dot" style="background:rgba(68,136,255,0.3)"></span>Legs</span>
    <span><span class="g-legend-dot" style="background:rgba(140,100,255,0.3)"></span>Glutes</span>
    <span><span class="g-legend-dot" style="background:rgba(255,170,50,0.3)"></span>Core</span>
    <span><span class="g-legend-dot" style="background:rgba(255,100,80,0.3)"></span>Push</span>
    <span><span class="g-legend-dot" style="background:rgba(68,220,160,0.3)"></span>Pull</span>
    <span><span class="g-legend-dot" style="background:rgba(68,255,136,0.3)"></span>Post. chain</span>
    <span><span class="g-legend-dot" style="background:rgba(255,68,68,0.3)"></span>Cardio</span>
  </div>`;
  guideWeeks.forEach(wk=>{
    const prefix='week'+wk.week+'-';
    const weekTotal=wk.moves.length;
    const weekDone=getGuideDoneCount(prefix);
    wkTotalAll+=weekTotal; wkDoneAll+=weekDone;
    const weekAllDone=weekDone===weekTotal&&weekTotal>0;
    let body='';
    wk.moves.forEach((m,i)=>{body+=renderGuideCard(m,null,null,true,prefix+i);});
    wkH+=`<div class="g-week" id="gweek-${wk.week}">
      <div class="g-week-hdr" onclick="document.getElementById('gweek-${wk.week}').classList.toggle('open')">
        <span class="g-week-title">${wk.label}</span>
        <span class="g-week-progress${weekAllDone?' all-done':''}">${weekDone}/${weekTotal}</span>
        ${wk.done?'<span class="g-done-badge">Done</span>':''}
        <span class="g-chevron">\u25BE</span>
      </div>
      <div class="g-week-body">${body}</div>
    </div>`;
  });
  wkH+='<div class="guide-banner" style="margin-top:10px">Weeks 7\u201312 not yet programmed by trainer</div>';
  document.getElementById('guide-workout').innerHTML=wkH;

  // PT Workout3 section (3 days per week, 4 weeks)
  let wo3TotalAll=0,wo3DoneAll=0;
  let wo3H='<div class="guide-banner">3 days per week \u2014 Full Body Strength, Endurance & Plyos/VO2 max</div>';
  guideWorkout3.forEach(wk=>{
    let weekTotal=0,weekDone=0;
    let weekBody='';
    wk.days.forEach(day=>{
      const dayPrefix='wo3-w'+wk.week+'d'+day.day+'-';
      const dayTotal=day.moves.length;
      const dayDone=getGuideDoneCount(dayPrefix);
      weekTotal+=dayTotal; weekDone+=dayDone;
      const dayAllDone=dayDone===dayTotal&&dayTotal>0;
      let dayBody='';
      day.moves.forEach((m,i)=>{dayBody+=renderGuideCard(m,null,null,true,dayPrefix+i);});
      weekBody+=`<div class="g-week" id="gwo3-w${wk.week}d${day.day}" style="margin:6px 0">
        <div class="g-week-hdr" onclick="document.getElementById('gwo3-w${wk.week}d${day.day}').classList.toggle('open')">
          <span class="g-week-title">${day.label}</span>
          <span class="g-week-progress${dayAllDone?' all-done':''}">${dayDone}/${dayTotal}</span>
          <span class="g-chevron">\u25BE</span>
        </div>
        <div class="g-week-body">${dayBody}</div>
      </div>`;
    });
    wo3TotalAll+=weekTotal; wo3DoneAll+=weekDone;
    const weekAllDone=weekDone===weekTotal&&weekTotal>0;
    wo3H+=`<div class="g-week" id="gwo3-w${wk.week}">
      <div class="g-week-hdr" onclick="document.getElementById('gwo3-w${wk.week}').classList.toggle('open')">
        <span class="g-week-title">${wk.label}</span>
        <span class="g-week-progress${weekAllDone?' all-done':''}">${weekDone}/${weekTotal}</span>
        <span class="g-chevron">\u25BE</span>
      </div>
      <div class="g-week-body">${weekBody}</div>
    </div>`;
  });
  document.getElementById('guide-workout3').innerHTML=wo3H;

  // Update sub-tab labels with counts
  const tabs=document.querySelectorAll('#page-guide .guide-tab');
  const wuAllDone=wuDone===wuTotal&&wuTotal>0;
  const cdAllDone=cdDone===cdTotal&&cdTotal>0;
  const wkAllDoneAll=wkDoneAll===wkTotalAll&&wkTotalAll>0;
  const wo3AllDone=wo3DoneAll===wo3TotalAll&&wo3TotalAll>0;
  tabs[0].innerHTML='Warm-up <span class="g-tab-count'+(wuAllDone?' all-done':'')+'\">('+wuDone+'/'+wuTotal+')</span>';
  tabs[1].innerHTML='PT Workouts <span class="g-tab-count'+(wkAllDoneAll?' all-done':'')+'\">('+wkDoneAll+'/'+wkTotalAll+')</span>';
  tabs[2].innerHTML='PT Workout3 <span class="g-tab-count'+(wo3AllDone?' all-done':'')+'\">('+wo3DoneAll+'/'+wo3TotalAll+')</span>';
  tabs[3].innerHTML='Cooldown <span class="g-tab-count'+(cdAllDone?' all-done':'')+'\">('+cdDone+'/'+cdTotal+')</span>';
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchToTab(tab.dataset.page));
});

document.getElementById('weightStep').addEventListener('change', function() {
  setWeightStep(this.value);
});

// ========================
function init() {
  const now = new Date();
  document.getElementById('todayLabel').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  renderGuidePage();
}

init();
</script>
